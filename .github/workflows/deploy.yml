name: Deploy AlloCat to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - dev
    paths-ignore:
      - 'docs/assets/**'
      - '.nojekyll'
      - 'docs/.nojekyll'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  build-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .git
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify runtime and build production bundle
        run: |
          node -v
          bun --version
          bun install --frozen-lockfile --no-progress
          bun run build
          mkdir -p docs
          cp -r dist/* docs/
          touch docs/.nojekyll .nojekyll

      - name: Commit compiled assets to docs/ for Branch Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ .nojekyll
          if ! git diff --staged --quiet; then
            git commit -m "chore: update compiled bundle in docs/"
            git push origin "${GITHUB_REF_NAME}"
          fi
